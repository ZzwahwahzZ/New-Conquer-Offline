name: Godot 4.3 CI and Web

on:
  push:
    branches: [main, phase3a-terrain-architecture]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable
  GODOT_TEMPLATE_VERSION: 4.3.stable

jobs:
  verify:
    name: Headless import and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 runtime only (exports paused)
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Restore PBR terrain packages and heightmaps from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --disable-pip-version-check huggingface_hub
          python3 tools/restore_hf_terrain_assets.py
          python3 tools/sync_rpg_ui_assets.py
          python3 tools/restore_kenney_environment_assets.py
          python3 -m py_compile tools/restore_kenney_environment_assets.py
          npm install --global @gltf-transform/cli@4.5.1
          while IFS= read -r -d '' asset; do
            temp="${asset%.glb}.dequantized.glb"
            gltf-transform dequantize "$asset" "$temp"
            test -s "$temp"
            mv "$temp" "$asset"
            echo "GODOT_COMPATIBLE_GLB: $asset"
          done < <(find assets/environment/kenney -type f -name '*.glb' -print0)
          python3 tools/kenney_asset_preflight.py
      - name: Cache official Quaternius downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/quaternius
          key: ${{ runner.os }}-quaternius-github-cc0-0128ca510d653bb0-v3
          restore-keys: |
            ${{ runner.os }}-quaternius-github-cc0-

      - name: Download pinned Quaternius CC0 GLB models from public GitHub
        run: python3 tools/fetch_quaternius_assets.py

      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3-imported-

      - name: Sanitize temporary GLB and texture assets before Godot import
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/sanitize_godot_assets.py --root . --quarantine /tmp/godot-asset-quarantine --max-glb-mb 50 --max-glb-nodes 2000 --max-image-dimension 1024
      - name: Install virtual X server for stable Godot 3D import
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xorg xz-utils
      - name: Step 1 - Initialize Editor Classes
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 tools/godot_import_guard.py --editor-classes --godot godot --project . --log reports/editor_classes.log
          test -s .godot/global_script_class_cache.cfg
          echo "EDITOR_CLASSES_INITIALIZATION_PASS"

      - name: Diagnose scripts and material resources after global class initialization
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --audio-driver Dummy --path . --script res://tools/diagnose_scripts_materials.gd

      - name: Step 2 - Import Scripts, Materials & Build
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          timeout 120s godot --headless --path . --import 2>&1 | tee reports/godot_import_guard.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Failed loading resource' reports/godot_import_guard.log; then
            echo "::error::Godot import emitted parser or resource-load errors."
            exit 1
          fi

      - name: Restore canonical project settings after temporary Compatibility import
        if: always()
        run: git checkout -- project.godot

      - name: Upload Import Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Import-Logs-Verify
          path: reports/godot_import_guard.log
          if-no-files-found: warn
          retention-days: 14

      - name: Save partial Godot import cache after failed import
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}

      - name: Verify canonical Mobile renderer and Autoload order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("project.godot").read_text()
          expected = ["ClassSystem=", "GearDatabase=", "GearSystem=", "GlobalEconomy=", "GameState="]
          positions = [source.find(name) for name in expected]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              raise SystemExit("Autoload order is missing or changed: " + " -> ".join(expected))
          if 'renderer/rendering_method="mobile"' not in source:
              raise SystemExit("Main project renderer must remain Mobile.")
          if 'renderer/rendering_method.mobile="mobile"' not in source:
              raise SystemExit("Mobile renderer fallback setting changed.")
          print("CANONICAL_PROJECT_SETTINGS_PASS: Mobile renderer + required Autoload order")
          PY

      - name: Run Step 11 smoke test
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/step11_smoke_test.gd

      - name: Run Step 12 smoke test (Save v6)
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/step12_smoke_test.gd

      - name: Run Step 13 smoke test
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/step13_smoke_test.gd

      - name: Run Step 14 smoke test
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/step14_smoke_test.gd

      - name: Run Step 15 smoke test (PBR terrain material library)
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/pbr_material_library_test.gd

      - name: Run Step 16 smoke test
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/step16_smoke_test.gd

      - name: Verify world environment, sunlight and Twin City ground
        timeout-minutes: 4
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/world_environment_test.gd

      - name: Verify all six classic city street environments
        timeout-minutes: 10
        shell: bash
        run: bash tools/run_godot_smoke_test.sh scripts/city_street_dressing_test.gd 420s

      - name: Capture thirty close classic-Conquer camera proof frames across all six cities
        id: capture_visual_proof
        timeout-minutes: 15
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports/visual-proof
          timeout 600s xvfb-run -a godot --path . --script res://tools/capture_visual_proof.gd 2>&1 | tee reports/visual-proof/capture.log
          cities=(twincity desertland volcanoland iceland waterlands darkforest)
          city_index=1
          for city in "${cities[@]}"; do
            for sample in 01_plaza_close 02_shop_street_close 03_main_gate_horizon 04_outer_world; do
              test -s "reports/visual-proof/city_${city_index}_${city}_${sample}.png"
            done
            test -s "reports/visual-proof/city_${city_index}_${city}_05_orbit_90.png"
            city_index=$((city_index+1))
          done
          for city_index in "${!cities[@]}"; do
            city="${cities[$city_index]}"
            test -s "reports/visual-proof/phase3a_panorama_$((city_index + 1))_${city}.png"
          done
          file reports/visual-proof/*.png
          test "$(find reports/visual-proof -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 36
          echo "THIRTY_CITY_ARCHITECTURE_FRAMES_AND_SIX_PHASE3A_PANORAMAS_PASS"

      - name: Upload Visual Screenshot Proof
        if: always() && steps.capture_visual_proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NewConquerOffline-Phase3A-World-Panoramas-6
          path: reports/visual-proof/
          if-no-files-found: error
          retention-days: 30


      - name: Phase 2 - Verify classic RPG HUD, Arabic RTL and Auto-Quest; capture six real UI screens
        id: phase2_ui_proof
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reports/phase2-ui
          test -s "assets/ui/fonts/NotoSansArabic[wght].ttf"
          timeout 420s xvfb-run -a godot --path . --script res://tools/capture_phase2_ui_proof.gd 2>&1 | tee reports/phase2-ui/capture.log
          expected=(
            01_twincity_gameplay_hud.png
            02_character_gear.png
            03_inventory_hotkeys.png
            04_shopping_mall.png
            05_auto_quest_tracking.png
            06_desertland_consistent_hud.png
          )
          for image in "${expected[@]}"; do
            test -s "reports/phase2-ui/$image"
          done
          test "$(find reports/phase2-ui -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 6
          file reports/phase2-ui/*.png
          echo "PHASE2_SIX_REAL_UI_SCREENSHOTS_PASS"

      - name: Upload Phase 2 UI screenshot proof
        if: always() && steps.phase2_ui_proof.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NewConquerOffline-Phase2-UI-Proof-6
          path: reports/phase2-ui/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Smoke Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Smoke-Test-Logs
          path: reports/smoke-tests/*.log
          if-no-files-found: warn
          retention-days: 14

      # Phase 1 excludes character/monster assets; Step 17B is deferred to phase 3.

  web:
    if: false # Temporarily disabled during phase-one architectural visual proof.
    name: Export WebGL2 build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DEST"
          curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          echo "Godot export template archive contents:"
          find /tmp/godot-templates -type f -name '*.zip' -printf '%P\n' | sort
          TEMPLATE_SOURCE="$(find /tmp/godot-templates -type d -name templates -print -quit)"
          test -n "$TEMPLATE_SOURCE"
          cp -av "$TEMPLATE_SOURCE"/* "$TEMPLATE_DEST"/
          echo "Installed Godot export templates:"
          ls -la "$TEMPLATE_DEST"
          test -s "$TEMPLATE_DEST/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DEST/web_nothreads_release.zip"
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"
          godot --version

      - name: Restore PBR terrain packages and heightmaps from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --disable-pip-version-check huggingface_hub
          python3 tools/restore_hf_terrain_assets.py
          python3 tools/sync_rpg_ui_assets.py
          npm install --global @gltf-transform/cli@4.5.1
          while IFS= read -r -d '' asset; do
            temp="${asset%.glb}.dequantized.glb"
            gltf-transform dequantize "$asset" "$temp"
            test -s "$temp"
            mv "$temp" "$asset"
            echo "GODOT_COMPATIBLE_GLB: $asset"
          done < <(find assets/environment/kenney -type f -name '*.glb' -print0)
      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3-imported-

      - name: Sanitize temporary GLB and texture assets before Godot import
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/sanitize_godot_assets.py --root . --quarantine /tmp/godot-asset-quarantine --max-glb-mb 50 --max-glb-nodes 2000 --max-image-dimension 1024
      - name: Install virtual X server for stable Godot 3D import
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xorg xz-utils
      - name: Step 1 - Initialize Editor Classes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 tools/godot_import_guard.py --editor-classes --godot godot --project . --log reports/editor_classes.log
          test -s .godot/global_script_class_cache.cfg
          echo "EDITOR_CLASSES_INITIALIZATION_PASS"

      - name: Step 2 - Import Scripts, Materials & Build
        timeout-minutes: 45
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          timeout 120s godot --headless --path . --import 2>&1 | tee reports/godot_import_guard.log

      - name: Upload Import Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Import-Logs-Web
          path: reports/godot_import_guard.log
          if-no-files-found: warn
          retention-days: 14

      - name: Save partial Godot import cache after failed import
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}

      - name: Switch temporary web build to Compatibility renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text()
          replacements = {
              'renderer/rendering_method="mobile"': 'renderer/rendering_method="gl_compatibility"',
              'renderer/rendering_method.mobile="mobile"': 'renderer/rendering_method.mobile="gl_compatibility"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected renderer setting was not found: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -F 'renderer/rendering_method="gl_compatibility"' project.godot
          grep -F 'renderer/rendering_method.mobile="gl_compatibility"' project.godot

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          echo "Web export created: build/web/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: false # Temporarily disabled with Web export during phase-one architectural visual proof.
    name: Enable Pages and deploy live game
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          # GitHub requires a token with Pages/admin write access for first-time enablement.
          # Add repository secret PAGES_TOKEN (classic PAT with repo scope or fine-grained Pages write + Administration read/write).
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live game URL
        run: |
          echo "LIVE_WEB_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

  android:
    if: false # Phase-one closeout exports Web only; Android APK intentionally deferred.
    name: Build signed debug Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DEST"
          curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --connect-timeout 20 --max-time 180 --retry 2 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          echo "Godot export template archive contents:"
          find /tmp/godot-templates -type f -name '*.zip' -printf '%P\n' | sort
          TEMPLATE_SOURCE="$(find /tmp/godot-templates -type d -name templates -print -quit)"
          test -n "$TEMPLATE_SOURCE"
          cp -av "$TEMPLATE_SOURCE"/* "$TEMPLATE_DEST"/
          echo "Installed Godot export templates:"
          ls -la "$TEMPLATE_DEST"
          test -s "$TEMPLATE_DEST/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DEST/web_nothreads_release.zip"
          test -s "$TEMPLATE_DEST/android_debug.apk"
          test -s "$TEMPLATE_DEST/android_release.apk"
          godot --version

      - name: Generate temporary Android debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -s build/debug.keystore

      - name: Configure Godot Android SDK and signing settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/build/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Restore PBR terrain packages and heightmaps from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pip install --disable-pip-version-check huggingface_hub
          python3 tools/restore_hf_terrain_assets.py
          python3 tools/sync_rpg_ui_assets.py
          npm install --global @gltf-transform/cli@4.5.1
          while IFS= read -r -d '' asset; do
            temp="${asset%.glb}.dequantized.glb"
            gltf-transform dequantize "$asset" "$temp"
            test -s "$temp"
            mv "$temp" "$asset"
            echo "GODOT_COMPATIBLE_GLB: $asset"
          done < <(find assets/environment/kenney -type f -name '*.glb' -print0)
      - name: Cache Godot imported assets
        uses: actions/cache@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-4.3-imported-

      - name: Sanitize temporary GLB and texture assets before Godot import
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/sanitize_godot_assets.py --root . --quarantine /tmp/godot-asset-quarantine --max-glb-mb 50 --max-glb-nodes 2000 --max-image-dimension 1024
      - name: Install virtual X server for stable Godot 3D import
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xorg xz-utils
      - name: Step 1 - Initialize Editor Classes
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 tools/godot_import_guard.py --editor-classes --godot godot --project . --log reports/editor_classes.log
          test -s .godot/global_script_class_cache.cfg
          echo "EDITOR_CLASSES_INITIALIZATION_PASS"

      - name: Step 2 - Import Scripts, Materials & Build
        timeout-minutes: 45
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          timeout 120s godot --headless --path . --import 2>&1 | tee reports/godot_import_guard.log

      - name: Upload Import Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Import-Logs-Android
          path: reports/godot_import_guard.log
          if-no-files-found: warn
          retention-days: 14

      - name: Save partial Godot import cache after failed import
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            .godot/imported
            .godot/global_script_class_cache.cfg
          key: ${{ runner.os }}-godot-4.3-imported-${{ hashFiles('project.godot', 'assets/**', '**/*.import') }}

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/NewConquerOffline.apk
          test -s build/android/NewConquerOffline.apk
          ls -lh build/android/NewConquerOffline.apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/build/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewConquerOffline-Android-APK
          path: build/android/NewConquerOffline.apk
          if-no-files-found: error
          retention-days: 30
