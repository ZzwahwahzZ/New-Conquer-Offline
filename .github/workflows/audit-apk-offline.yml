name: Audit APK for Offline Conversion

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/audit-apk-offline.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify APK payloads and inspect their internals
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, hashlib, re, os
          from pathlib import Path
          root = Path("source_game/extracted")
          apks = sorted(root.glob("*.apk"))
          if len(apks) != 4:
              raise SystemExit(f"Expected 4 APK files, found {len(apks)}")
          result = {"purpose":"Read-only inventory to plan a complete offline conversion; no source APKs are modified.",
                    "apk_count":len(apks),"apks":[],"overall_findings":[]}
          url_re = re.compile(rb"https?://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]{5,}")
          for apk in apks:
              item={"file":apk.name,"bytes":apk.stat().st_size,"sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                    "zip_valid":False,"entry_count":0,"top_level":{},"extensions":{},
                    "large_files":[],"engine_markers":[],"network_strings":[],"dex_files":[],"native_libs":[]}
              try:
                  with zipfile.ZipFile(apk) as z:
                      bad=z.testzip()
                      if bad: raise RuntimeError("Corrupt ZIP entry: "+bad)
                      infos=z.infolist()
                      item["zip_valid"]=True
                      item["entry_count"]=len(infos)
                      for info in infos:
                          name=info.filename
                          if not name.endswith("/"):
                              top=name.split("/")[0]
                              item["top_level"][top]=item["top_level"].get(top,0)+1
                              ext=Path(name).suffix.lower() or "[no extension]"
                              item["extensions"][ext]=item["extensions"].get(ext,0)+1
                              if info.file_size >= 5*1024*1024:
                                  item["large_files"].append({"path":name,"bytes":info.file_size})
                          if name.endswith(".dex"): item["dex_files"].append(name)
                          if name.startswith("lib/") and name.endswith(".so"): item["native_libs"].append(name)
                      markers=[b"Unity",b"Il2Cpp",b"Unreal",b"Cocos2d",b"libgodot",b"Godot",b"libUE4",b"libcocos"]
                      for info in infos:
                          if info.file_size > 80*1024*1024 or info.is_dir(): continue
                          if info.filename.endswith((".dex",".so",".xml",".json",".txt",".ini",".cfg")):
                              try: data=z.read(info)
                              except Exception: continue
                              for marker in markers:
                                  if marker.lower() in data.lower():
                                      m=marker.decode()
                                      if m not in item["engine_markers"]: item["engine_markers"].append(m)
                              if info.filename.endswith((".dex",".so",".xml",".json",".txt",".ini",".cfg")):
                                  for u in url_re.findall(data):
                                      s=u.decode("utf-8","ignore").rstrip(".,;)")
                                      if s and s not in item["network_strings"] and len(item["network_strings"])<100:
                                          item["network_strings"].append(s)
              except Exception as e:
                  item["error"]=str(e)
              result["apks"].append(item)
          result["overall_findings"].append("This is an inventory only. Online dependencies must be traced in code/config and replaced with local equivalents; this report does not claim the game is offline.")
          out=Path("offline-conversion-audit")
          out.mkdir(exist_ok=True)
          (out/"apk-inventory.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          summary=["# APK inventory for offline conversion","",
                   f"APK files inspected: {len(apks)}","",
                   "| APK | ZIP valid | Entries | DEX | Native libraries |",
                   "|---|---:|---:|---:|---:|"]
          for a in result["apks"]:
              summary.append(f"| {a['file']} | {a['zip_valid']} | {a['entry_count']} | {len(a['dex_files'])} | {len(a['native_libs'])} |")
          summary += ["","Detailed file lists, engine markers, large assets and discovered URL strings are in apk-inventory.json.",
                      "","**Important:** This report is read-only reconnaissance, not an offline conversion result."]
          (out/"README.md").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          print("JSON inventory:",out/"apk-inventory.json")
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: offline-conversion-apk-audit
          path: offline-conversion-audit/
          if-no-files-found: error
