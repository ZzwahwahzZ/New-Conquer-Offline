name: Collect Twin City Chinese Houses and Shops

on:
  workflow_dispatch:
  push:
    branches:
      - "twin-city/imperial-visual-prototype"
    paths:
      - ".github/workflows/collect-twin-city-houses-shops.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prepare original asset library
        run: |
          mkdir -p collection/chinese-historical-houses collection/chinese-historical-shops
          cat > collection/README.md <<'EOF'
          # Twin City — Chinese historical houses and shops

          Original, unmodified downloadable GLB files collected from their publishers.
          No geometry edits, derivations, recolors, or generated replacements are performed here.

          ## Included sources

          - Courtyard Residence — Han courtyard residence, 1,924 triangles, 16 × 5.79 × 16 m.
            Original GLB: https://polyfork.dev/cdn/courtyard-residence-342ac2.glb
            Source page: https://polyfork.dev/asset/courtyard-residence-342ac2
            Commercial use permitted. For redistribution of the raw mesh file, CC BY 4.0 credit:
            "Courtyard Residence" by Polyfork — https://polyfork.dev/asset/courtyard-residence-342ac2
            License: https://creativecommons.org/licenses/by/4.0/

          - Market Stall — Han-period market stall, 1,561 triangles, 4 × 3.92 × 4 m.
            Original GLB: https://polyfork.dev/cdn/market-stall-9d0b29.glb
            Source page: https://polyfork.dev/asset/market-stall-9d0b29
            Commercial use permitted. For redistribution of the raw mesh file, CC BY 4.0 credit:
            "Market Stall" by Polyfork — https://polyfork.dev/asset/market-stall-9d0b29
            License: https://creativecommons.org/licenses/by/4.0/

          ## Collection boundaries
          This archive contains only these two original models and their provenance.
          It does not include CGTrader downloads, paid models, or assets with unclear licensing.
          EOF

      - name: Download original GLB files
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://polyfork.dev/cdn/courtyard-residence-342ac2.glb" \
            -o collection/chinese-historical-houses/courtyard-residence-342ac2.glb
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://polyfork.dev/cdn/market-stall-9d0b29.glb" \
            -o collection/chinese-historical-shops/market-stall-9d0b29.glb


      - name: Download additional originals from CGTrader and Sketchfab when authorized tokens exist
        env:
          CGTRADER_ACCESS_TOKEN: ${{ secrets.CGTRADER_ACCESS_TOKEN }}
          SKETCHFAB_ACCESS_TOKEN: ${{ secrets.SKETCHFAB_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, zipfile, io, hashlib, requests
          from pathlib import Path

          root = Path("collection")
          report = []
          headers = {"User-Agent": "TwinCityAssetCollector/1.0"}

          def record(name, status, detail):
              report.append({"asset": name, "status": status, "detail": detail})
              print(f"[{status}] {name}: {detail}")

          # CGTrader: authorized OAuth access token; never use account email as authentication.
          cg_token = os.getenv("CGTRADER_ACCESS_TOKEN", "").strip()
          cg_models = [
              ("Chinese Ancient house reference #3589754", 3589754, "chinese-historical-houses/cgtrader-3589754"),
              ("Ancient Traditional Chinese Building #3328346", 3328346, "chinese-historical-houses/cgtrader-3328346"),\n              ("Chinese ancient architecture #3889124", 3889124, "chinese-historical-houses/cgtrader-3889124"),\n              ("Chinese Temple High Poly #794558", 794558, "chinese-historical-houses/cgtrader-794558"),
          ]
          if not cg_token:
              for name, _, _ in cg_models:
                  record(name, "SKIPPED_AUTH_REQUIRED", "Set repository Actions secret CGTRADER_ACCESS_TOKEN to an authorized CGTrader OAuth access token.")
          else:
              h = {**headers, "Authorization": f"Bearer {cg_token}"}
              for name, model_id, dest in cg_models:
                  try:
                      res = requests.get(f"https://api.cgtrader.com/v1/models/{model_id}/files", headers=h, timeout=60)
                      res.raise_for_status()
                      payload = res.json()
                      files = payload if isinstance(payload, list) else payload.get("files", payload.get("data", []))
                      if isinstance(files, dict):
                          files = files.get("files", [])
                      if not files:
                          record(name, "NO_FILES", f"CGTrader API returned no downloadable files for model {model_id}.")
                          continue
                      out = root / dest
                      out.mkdir(parents=True, exist_ok=True)
                      saved = []
                      for item in files:
                          fid = item.get("id") or item.get("file_id")
                          fname = item.get("name") or item.get("filename") or f"file-{fid}"
                          if not fid:
                              continue
                          dl = requests.get(f"https://api.cgtrader.com/v1/models/{model_id}/files/{fid}", headers=h, allow_redirects=True, timeout=180)
                          dl.raise_for_status()
                          safe = Path(fname).name
                          target = out / safe
                          target.write_bytes(dl.content)
                          saved.append({"file": str(target), "bytes": len(dl.content), "sha256": hashlib.sha256(dl.content).hexdigest()})
                      record(name, "DOWNLOADED" if saved else "NO_FILES", json.dumps(saved))
                  except Exception as e:
                      record(name, "DOWNLOAD_FAILED", str(e))

          # Sketchfab Download API: user-authorized OAuth token; each response contains a short-lived archive URL.
          sf_token = os.getenv("SKETCHFAB_ACCESS_TOKEN", "").strip()
          sf_models = [
              ("Chinese ancient house", "48555048c4c540a78d23f055ca55a569", "chinese-historical-houses/sketchfab-ancient-house"),
              ("Ancient Chinese House", "bcb41894d1b5451b9c4f6489d50766d4", "chinese-historical-houses/sketchfab-ancient-chinese-house"),
              ("Chinese ancient building H26", "99d2ab2816914c46949b3f6a1bc7ae4d", "chinese-historical-houses/sketchfab-building-h26"),
              ("Chinese hut", "1b9c99b0fa9d49b88c4aa5b8c9c097da", "chinese-historical-houses/sketchfab-chinese-hut"),
              ("Ancient Chinese Noodle Shop", "5576aebcee724fc491e9d8901da99f2f", "chinese-historical-shops/sketchfab-noodle-shop"),\n              ("Ancient Chinese Courtyard House", "ed4ea9eb5f024d989eec182d48fa72d8", "chinese-historical-houses/sketchfab-courtyard-house"),\n              ("Low Big House", "52440b480fdb4fedb7d48e8586b373fc", "chinese-historical-houses/sketchfab-low-big-house"),\n              ("Low Big House low roof", "b5039dcf41f54800a6a8bb89f7183a8b", "chinese-historical-houses/sketchfab-low-big-house-low-roof"),
          ]
          if not sf_token:
              for name, _, _ in sf_models:
                  record(name, "SKIPPED_AUTH_REQUIRED", "Set repository Actions secret SKETCHFAB_ACCESS_TOKEN to an authorized Sketchfab OAuth access token.")
          else:
              h = {**headers, "Authorization": f"Bearer {sf_token}"}
              for name, uid, dest in sf_models:
                  try:
                      info = requests.get(f"https://api.sketchfab.com/v3/models/{uid}/download", headers=h, timeout=60)
                      info.raise_for_status()
                      archive_url = info.json()["gltf"]["url"]
                      archive = requests.get(archive_url, timeout=240)
                      archive.raise_for_status()
                      out = root / dest
                      out.mkdir(parents=True, exist_ok=True)
                      (out / "original-download.zip").write_bytes(archive.content)
                      with zipfile.ZipFile(io.BytesIO(archive.content)) as z:
                          bad = z.testzip()
                          if bad:
                              raise RuntimeError(f"Corrupt ZIP member: {bad}")
                          z.extractall(out / "source-files")
                      record(name, "DOWNLOADED", f"ZIP {len(archive.content)} bytes; extracted original glTF files and textures.")
                  except Exception as e:
                      record(name, "DOWNLOAD_FAILED", str(e))

          (root / "acquisition-report.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

      - name: Verify collected originals and create manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct
          root = Path("collection")
          entries = []
          for p in sorted(root.rglob("*.glb")):
              data = p.read_bytes()
              if len(data) < 20 or data[:4] != b"glTF":
                  raise SystemExit(f"Invalid GLB signature: {p}")
              version, declared_length = struct.unpack("<II", data[4:12])
              if version != 2 or declared_length != len(data):
                  raise SystemExit(f"Invalid GLB header/length: {p}")
              entries.append({
                  "file": str(p.relative_to(root)),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "glb_version": version
              })
          if len(entries) < 2:
              raise SystemExit(f"Expected at least the 2 baseline original GLB assets, found {len(entries)}")
          # Inventory downloaded archives, original meshes, glTF buffers, and textures.
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.suffix.lower() in {".zip", ".obj", ".fbx", ".gltf", ".bin", ".png", ".jpg", ".jpeg", ".tga"}:
                  rel = str(p.relative_to(root))
                  if any(item["file"] == rel for item in entries):
                      continue
                  data = p.read_bytes()
                  entries.append({"file": rel, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "file_type": p.suffix.lower().lstrip(".")})
          (root / "manifest.json").write_text(json.dumps(entries, indent=2) + "\n")
          print(json.dumps(entries, indent=2))
          PY

      - name: Commit original assets into the project branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection/
          if git diff --cached --quiet; then
            echo "Original asset collection already up to date."
          else
            git commit -m "Add original Chinese courtyard residence and Han market stall"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Package original assets
        run: |
          cd collection
          zip -r ../twin-city-chinese-houses-shops-originals.zip .

      - name: Upload collection archive
        uses: actions/upload-artifact@v4
        with:
          name: twin-city-chinese-houses-shops-originals
          path: twin-city-chinese-houses-shops-originals.zip
          if-no-files-found: error
          retention-days: 90
