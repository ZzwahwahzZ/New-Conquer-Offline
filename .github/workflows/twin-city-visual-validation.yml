name: Twin City Godot 4.3 Visual Validation

on:
  workflow_dispatch:
  push:
    branches:
      - twin-city/imperial-visual-prototype
    paths:
      - 'src/**'
      - 'project.godot'
      - '.github/workflows/twin-city-visual-validation.yml'

permissions:
  contents: write

concurrency:
  group: twin-city-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-capture:
    name: Run actual Twin City scene and capture six Godot views
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.3
      GODOT_RELEASE: 4.3-stable
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Checkout isolated prototype branch
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils libgl1-mesa-dri libglx-mesa0 mesa-utils
          curl --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 "/tmp/godot-bin/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          test "$(godot --version)" = "4.3.stable.official.77dcf97d8"

      - name: Restore licensed Imperial China model library from Hugging Face
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check huggingface_hub
          npm install --global @gltf-transform/cli
          mkdir -p assets/environment/architecture prototypes/twin_city/reports
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          source = hf_hub_download(
              repo_id="ZzwahwahzZ/clash-of-legends-terrain-assets",
              filename="settlement-terrain-source/curated-glb/architecture/imperial_china_palace_and_garden.glb",
              repo_type="dataset",
              token=os.environ.get("HF_TOKEN") or None,
          )
          target = Path("assets/environment/architecture/imperial_china_palace_and_garden.glb")
          shutil.copy2(source, target)
          data = target.read_bytes()
          if len(data) != 2876988 or data[:4] != b"glTF":
              raise SystemExit(f"Imperial China source integrity/format check failed: {len(data)} bytes")
          print(f"IMPERIAL_CHINA_SOURCE_RESTORED: {target} bytes={len(data)}")
          PY
          gltf-transform dequantize assets/environment/architecture/imperial_china_palace_and_garden.glb /tmp/imperial_china_dequantized.glb
          mv /tmp/imperial_china_dequantized.glb assets/environment/architecture/imperial_china_palace_and_garden.glb
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path = Path("assets/environment/architecture/imperial_china_palace_and_garden.glb")
          data = path.read_bytes()
          if data[:4] != b"glTF":
              raise SystemExit("Dequantized Imperial China GLB has invalid magic")
          json_length = struct.unpack_from("<I", data, 12)[0]
          document = json.loads(data[20:20+json_length].decode("utf-8").rstrip(" \\0"))
          extensions = set(document.get("extensionsUsed", [])) | set(document.get("extensionsRequired", []))
          if "KHR_mesh_quantization" in extensions:
              raise SystemExit("KHR_mesh_quantization still present after dequantization")
          print(f"IMPERIAL_CHINA_GODOT43_COMPATIBLE: bytes={len(data)} extensions={sorted(extensions)}")
          PY

      - name: Import root New-Conquer-Offline project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p prototypes/twin_city/reports prototypes/twin_city/captures
          timeout 600s godot --headless --path . --editor --import --quit 2>&1 | tee prototypes/twin_city/reports/godot_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|ERROR: Failed loading resource' prototypes/twin_city/reports/godot_import.log; then
            echo "::error::Godot import reported a script or resource error."
            exit 1
          fi

      - name: Inspect imported Imperial China model library
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path . --script res://src/scripts/TwinCityAssetInspection.gd 2>&1 | tee prototypes/twin_city/reports/imperial_china_asset_inventory.log

      - name: Run 150-180 structure acceptance audit
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path . --script res://src/scripts/TwinCityAcceptanceAudit.gd 2>&1 | tee prototypes/twin_city/reports/godot_acceptance_audit.log

      - name: Capture six real Godot 4.3 screenshots
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 900s xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://src/scripts/TwinCityGodotCapture.gd 2>&1 | tee prototypes/twin_city/reports/godot_capture.log
          for image in 01_aerial_full.png 02_aerial_oblique.png 03_street_scale.png 04_central_plaza.png 05_imperial_palace.png 06_district_density.png; do
            test -s "prototypes/twin_city/captures/$image"
          done
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("prototypes/twin_city/captures")
          names = ("01_aerial_full.png","02_aerial_oblique.png","03_street_scale.png","04_central_plaza.png","05_imperial_palace.png","06_district_density.png")
          for name in names:
              path = root / name
              with Image.open(path) as image:
                  if image.size != (1920,1080) or image.getbbox() is None:
                      raise SystemExit(f"Invalid Godot capture: {name} {image.size}")
                  print(f"VERIFIED {name}: {image.size}, {path.stat().st_size} bytes")
          PY

      - name: Verify 150-180 count, six images and 30 FPS target
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("prototypes/twin_city/reports/twin_city_build_report.json").read_text())
          count = report.get("buildings", 0)
          if not 150 <= count <= 180:
              raise SystemExit(f"Expected 150-180 buildings, got {count}")
          if report.get("screenshots_created") != 6:
              raise SystemExit("Six Godot screenshots were not captured")
          if not report.get("fps_target_30_pass", False):
              raise SystemExit(f"Measured FPS below 30: {report.get('measured_capture_fps_average')}")
          if not 340 <= report.get("city_core_m",0) <= 380:
              raise SystemExit("Urban core diameter outside 340-380m")
          print("TWIN_CITY_FINAL_VALIDATION_PASS: "+json.dumps(report,sort_keys=True))
          PY

      - name: Upload Godot screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwinCity-Godot43-Visual-Proof
          path: |
            prototypes/twin_city/captures/
            prototypes/twin_city/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve restored Imperial China GLB on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          asset="assets/environment/architecture/imperial_china_palace_and_garden.glb"
          if [ -s "$asset" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$asset"
            if ! git diff --cached --quiet; then
              git commit -m "Add verified Imperial China architecture kit"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            echo "No restored Imperial China kit to preserve."
          fi

      - name: Commit only Twin City proof outputs to this isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prototypes/twin_city/captures/*.png prototypes/twin_city/reports/*.json prototypes/twin_city/reports/*.log
          git diff --cached --quiet || git commit -m "Add actual Twin City Godot 4.3 visual proof"
          git push origin "HEAD:$GITHUB_REF_NAME"
