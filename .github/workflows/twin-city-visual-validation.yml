name: Twin City Godot 4.3 Visual Validation

on:
  workflow_dispatch:
  push:
    branches:
      - twin-city/imperial-visual-prototype
    paths:
      - 'src/**'
      - 'project.godot'
      - '.github/workflows/twin-city-visual-validation.yml'

permissions:
  contents: write

concurrency:
  group: twin-city-visual-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-capture:
    name: Run actual Twin City scene and capture six Godot views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.3
      GODOT_RELEASE: 4.3-stable
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Checkout isolated prototype branch
        uses: actions/checkout@v4

      - name: Restore 63 approved original GLB assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          manifest = json.loads(Path("assets/wuxia_imperial_pack/imperial_approved_assets.json").read_text())
          selected = []
          for category, limit in (("palaces_and_temples", 4), ("houses_and_shops", 23), ("gates_walls_bridges", 23), ("nature", 13)):
              entries = manifest["categories"][category]["assets"]
              if len(entries) < limit:
                  raise SystemExit(f"Approved category {category} has only {len(entries)} assets; expected {limit}")
              selected.extend(entries[:limit])
          if len(selected) != 63:
              raise SystemExit(f"Expected exactly 63 approved GLB records, got {len(selected)}")
          for index, item in enumerate(selected, 1):
              relative = item["file"]
              if not relative.lower().endswith(".glb"):
                  raise SystemExit(f"Non-GLB asset in approved selection: {relative}")
              target = Path("assets/wuxia_imperial_pack") / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              payload = target.read_bytes() if target.exists() else b""
              if len(payload) != item["bytes"] or hashlib.sha256(payload).hexdigest() != item["sha256"]:
                  request = urllib.request.Request(item["direct_download_url"], headers={"User-Agent":"TwinCity-Asset-Restore/1.0"})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      payload = response.read()
                  digest = hashlib.sha256(payload).hexdigest()
                  if len(payload) != item["bytes"] or digest != item["sha256"] or payload[:4] != b"glTF":
                      raise SystemExit(f"GLB integrity validation failed: {relative} bytes={len(payload)} sha256={digest}")
                  target.write_bytes(payload)
              print(f"RESTORED_APPROVED_GLB {index}/63 {relative} {item['bytes']} bytes")
          print("APPROVED_GLB_RESTORE_PASS: 63 original GLB assets verified against manifest SHA-256")
          PY

      - name: Install Godot 4.3 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils libgl1-mesa-dri libglx-mesa0 mesa-utils libvulkan1 mesa-vulkan-drivers vulkan-tools
          curl --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 "/tmp/godot-bin/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          test "$(godot --version)" = "4.3.stable.official.77dcf97d8"

      - name: Verify committed Godot 4.3-compatible Imperial China library
        shell: bash
        run: |
          set -Eeuo pipefail
          asset="assets/environment/architecture/imperial_china_palace_and_garden.glb"
          test -s "$asset"
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path = Path("assets/environment/architecture/imperial_china_palace_and_garden.glb")
          data = path.read_bytes()
          if data[:4] != b"glTF":
              raise SystemExit("Imperial China GLB magic invalid")
          json_length = struct.unpack_from("<I", data, 12)[0]
          document = json.loads(data[20:20+json_length].decode("utf-8").rstrip(" \\0"))
          extensions = set(document.get("extensionsUsed", [])) | set(document.get("extensionsRequired", []))
          if "KHR_mesh_quantization" in extensions:
              raise SystemExit("Imperial China GLB is not dequantized for Godot 4.3")
          print(f"IMPERIAL_CHINA_KIT_VERIFIED: bytes={len(data)} extensions={sorted(extensions)}")
          PY

      - name: Import root New-Conquer-Offline project
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p prototypes/twin_city/reports prototypes/twin_city/captures
          timeout 600s godot --headless --path . --editor --import --quit 2>&1 | tee prototypes/twin_city/reports/godot_import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load|ERROR: Failed loading resource' prototypes/twin_city/reports/godot_import.log; then
            echo "::error::Godot import reported a script or resource error."
            exit 1
          fi

      - name: Prebuild material-batched Imperial China palace scene
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path . --script res://src/scripts/TwinCityAssetBuild.gd 2>&1 | tee prototypes/twin_city/reports/imperial_kit_build.log
          test -s assets/environment/architecture/imperial_china_palace_and_garden_merged.scn
          godot --headless --path . --editor --import --quit 2>&1 | tee -a prototypes/twin_city/reports/godot_import.log

      - name: Inspect imported Imperial China model library
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path . --script res://src/scripts/TwinCityAssetInspection.gd 2>&1 | tee prototypes/twin_city/reports/imperial_china_asset_inventory.log

      - name: Run 220-260 structure acceptance audit
        shell: bash
        run: |
          set -Eeuo pipefail
          godot --headless --path . --script res://src/scripts/TwinCityAcceptanceAudit.gd 2>&1 | tee prototypes/twin_city/reports/godot_acceptance_audit.log

      - name: Capture six real Godot 4.3 screenshots
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          mkdir -p prototypes/twin_city/reports prototypes/twin_city/captures
          rm -f prototypes/twin_city/captures/01_aerial_full.png prototypes/twin_city/captures/02_aerial_oblique.png prototypes/twin_city/captures/03_street_scale.png prototypes/twin_city/captures/04_central_plaza.png prototypes/twin_city/captures/05_imperial_palace.png prototypes/twin_city/captures/06_district_density.png
          rm -f prototypes/twin_city/reports/godot_capture.log
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname '*lvp*.json' | head -n 1)"
          if [ -z "$lvp_icd" ]; then
            echo "Lavapipe ICD not found; installed Vulkan ICDs:"
            ls -la /usr/share/vulkan/icd.d
            exit 1
          fi
          export VK_ICD_FILENAMES="$lvp_icd"
          vulkaninfo --summary
          timeout 900s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method mobile --rendering-driver vulkan --script res://src/scripts/TwinCityGodotCapture.gd 2>&1 | tee prototypes/twin_city/reports/godot_capture.log
          for image in 01_aerial_full.png 02_aerial_oblique.png 03_street_scale.png 04_central_plaza.png 05_imperial_palace.png 06_district_density.png; do
            test -s "prototypes/twin_city/captures/$image"
          done
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("prototypes/twin_city/captures")
          names = ("01_aerial_full.png","02_aerial_oblique.png","03_street_scale.png","04_central_plaza.png","05_imperial_palace.png","06_district_density.png")
          for name in names:
              path = root / name
              with Image.open(path) as image:
                  if image.size != (1280,720) or image.getbbox() is None:
                      raise SystemExit(f"Invalid Godot capture: {name} {image.size}")
                  print(f"VERIFIED {name}: {image.size}, {path.stat().st_size} bytes")
          PY

      - name: Verify 220-260 count, six images and performance telemetry
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("prototypes/twin_city/reports/twin_city_build_report.json").read_text())
          count = report.get("buildings", 0)
          if not 220 <= count <= 260:
              raise SystemExit(f"Expected 220-260 buildings, got {count}")
          if report.get("screenshots_created") != 6:
              raise SystemExit("Six Godot screenshots were not captured")
          if not report.get("fps_target_30_pass", False):
              if "lvp" in report.get("renderer_icd","").lower():
                  print("PERFORMANCE_NOTE: Lavapipe software Vulkan is below 30 FPS; do not treat it as a Redmi/Adreno benchmark.")
              else:
                  raise SystemExit(f"Hardware renderer measured FPS below 30: {report.get('measured_capture_fps_average')}")
          if not 340 <= report.get("city_core_m",0) <= 380:
              raise SystemExit("Urban core diameter outside 340-380m")
          print("TWIN_CITY_FINAL_VALIDATION_PASS: "+json.dumps(report,sort_keys=True))
          PY

      - name: Upload Godot screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TwinCity-Godot43-Visual-Proof
          path: |
            assets/environment/architecture/imperial_china_palace_and_garden_merged.scn
            prototypes/twin_city/captures/
            prototypes/twin_city/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve prebuilt merged palace kit on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          asset="assets/environment/architecture/imperial_china_palace_and_garden_merged.scn"
          if [ -s "$asset" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$asset" assets/wuxia_imperial_pack/models/
            if ! git diff --cached --quiet; then
              git commit -m "Add prebuilt Imperial China palace scene"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            echo "No prebuilt merged palace scene to preserve."
          fi

      - name: Commit only Twin City proof outputs to this isolated branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/environment/architecture/imperial_china_palace_and_garden_merged.scn prototypes/twin_city/captures/*.png prototypes/twin_city/reports/*.json prototypes/twin_city/reports/*.log
          git diff --cached --quiet || git commit -m "Add actual Twin City Godot 4.3 visual proof"
          git push origin "HEAD:$GITHUB_REF_NAME"
