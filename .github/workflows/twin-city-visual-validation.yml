name: Twin City Surgical Visual Proof

on:
  workflow_dispatch:
  push:
    branches:
      - twin-city/imperial-visual-prototype
    paths:
      - 'src/scripts/TwinCityGLBRebuilder.gd'
      - 'src/scripts/TwinCityAcceptanceAudit.gd'
      - 'src/scripts/TwinCityGodotCapture.gd'
      - 'src/scripts/SettlementWorld.gd'
      - '.github/workflows/twin-city-visual-validation.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: twin-city-surgical-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-twin-city-proof:
    name: "Cache-only audit and independent six-view capture"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.3
      GODOT_RELEASE: 4.3-stable
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - name: Checkout isolated prototype branch
        uses: actions/checkout@v4
        with:
          ref: twin-city/imperial-visual-prototype

      - name: Restore cleaned GLB asset cache (no Hugging Face access)
        id: assets_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/wuxia_imperial_pack
            assets/twin_city_selected
            prototypes/twin_city/reports/glb_geometry_audit.json
            prototypes/twin_city/reports/twin_city_asset_restore.json
          key: cleaned-glb-assets-v1

      - name: Restore Godot 4.3 imported-resource cache (no project re-import)
        id: godot_cache
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: godot43-imported-cache-v1

      - name: Require both permanent caches and verify their contents
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.assets_cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::cleaned-glb-assets-v1 cache was not restored. Refusing all Hugging Face downloads."
            exit 1
          fi
          if [ "${{ steps.godot_cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::godot43-imported-cache-v1 cache was not restored. Refusing a full project import."
            exit 1
          fi
          test -s assets/wuxia_imperial_pack/imperial_approved_assets.json
          test -s assets/twin_city_selected/selection_manifest.json
          test -s assets/environment/architecture/imperial_china_palace_and_garden.glb
          test -d .godot/imported
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("assets/twin_city_selected/selection_manifest.json").read_text())
          assets = manifest.get("assets", [])
          if not assets:
              raise SystemExit("Cleaned GLB selection manifest is empty")
          missing = []
          for item in assets:
              path = Path("assets/twin_city_selected") / item["file"]
              if not path.is_file() or path.stat().st_size == 0:
                  missing.append(str(path))
          if missing:
              raise SystemExit("Missing cached GLB assets: " + ", ".join(missing[:20]))
          imported_count = sum(1 for path in Path(".godot/imported").rglob("*") if path.is_file())
          if imported_count < 100:
              raise SystemExit(f"Imported-resource cache unexpectedly small: {imported_count} files")
          print(f"CACHE_ONLY_READY: cleaned_glb_assets={len(assets)} imported_cache_files={imported_count}")
          print("IMPORT_POLICY: no Hugging Face downloads; no --editor --import; use restored caches directly")
          PY

      - name: Install Godot 4.3 and capture dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils unzip libgl1-mesa-dri libglx-mesa0 mesa-utils libvulkan1 mesa-vulkan-drivers vulkan-tools
          curl --connect-timeout 20 --max-time 240 --retry 3 --retry-delay 5 -fL "https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 "/tmp/godot-bin/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          test "$(godot --version)" = "4.3.stable.official.77dcf97d8"

      - name: Remove legacy proof images
        shell: bash
        run: |
          find . -type f \( -name 'twin_city_aerial.png' -o -name 'twin_city_street.png' \) -print -delete
          if find . -type f \( -name 'twin_city_aerial.png' -o -name 'twin_city_street.png' \) -print -quit | grep -q .; then
            echo "::error::Legacy Twin City proof images remain."
            exit 1
          fi

      - name: Run 244-building and global AABB acceptance audit from cache
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p prototypes/twin_city/reports prototypes/twin_city/captures
          godot --headless --audio-driver Dummy --path . --script res://src/scripts/TwinCityAcceptanceAudit.gd 2>&1 | tee prototypes/twin_city/reports/godot_acceptance_audit.log
          grep -q 'TWIN_CITY_AUDIT_PASS:' prototypes/twin_city/reports/godot_acceptance_audit.log
          if grep -E 'ERROR: Parameter "m" is null|SCRIPT ERROR:|Parse Error:|TWIN_CITY_AUDIT_FAIL:' prototypes/twin_city/reports/godot_acceptance_audit.log; then
            echo "::error::Acceptance audit reported a mesh or script error."
            exit 1
          fi

      - name: Capture six independent 1280x720 Godot views
        shell: bash
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          rm -f prototypes/twin_city/captures/01_aerial_full.png prototypes/twin_city/captures/02_aerial_oblique.png prototypes/twin_city/captures/03_street_scale.png prototypes/twin_city/captures/04_central_plaza.png prototypes/twin_city/captures/05_imperial_palace.png prototypes/twin_city/captures/06_district_density.png
          rm -f prototypes/twin_city/reports/godot_capture.log
          lvp_icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -iname '*lvp*.json' | head -n 1)"
          test -n "$lvp_icd"
          export VK_ICD_FILENAMES="$lvp_icd"
          timeout 900s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method mobile --rendering-driver vulkan --audio-driver Dummy --script res://src/scripts/TwinCityGodotCapture.gd 2>&1 | tee prototypes/twin_city/reports/godot_capture.log
          grep -q 'TWIN_CITY_SIX_VIEW_CAPTURE_PASS' prototypes/twin_city/reports/godot_capture.log
          if grep -E 'ERROR: Parameter "m" is null|SCRIPT ERROR:|Parse Error:|TWIN_CITY_CAPTURE_FAIL:' prototypes/twin_city/reports/godot_capture.log; then
            echo "::error::Capture reported a mesh or script error."
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("prototypes/twin_city/captures")
          names = ("01_aerial_full.png","02_aerial_oblique.png","03_street_scale.png","04_central_plaza.png","05_imperial_palace.png","06_district_density.png")
          for name in names:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing capture: {name}")
              with Image.open(path) as image:
                  if image.size != (1280,720) or image.getbbox() is None:
                      raise SystemExit(f"Invalid capture: {name} {image.size}")
                  print(f"VERIFIED {name}: {image.size}, {path.stat().st_size} bytes")
          for legacy in ("twin_city_aerial.png","twin_city_street.png"):
              if any(Path(".").rglob(legacy)):
                  raise SystemExit(f"Legacy proof image remains: {legacy}")
          PY

      - name: Commit six captures and audit reports to isolated branch
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f prototypes/twin_city/captures prototypes/twin_city/reports
          if ! git diff --cached --quiet; then
            git commit -m "Publish surgical Twin City grounding and six-view proof"
            git push origin "HEAD:twin-city/imperial-visual-prototype"
          fi

      - name: Upload Twin City visual proof artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TwinCity-Surgical-Visual-Proof
          path: |
            prototypes/twin_city/captures/
            prototypes/twin_city/reports/
          if-no-files-found: error
          retention-days: 30
