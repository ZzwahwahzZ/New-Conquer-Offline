name: Offline Asset Audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Offline Conversion Pipeline"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: offline-asset-audit-main
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original resources
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Install 7z reader
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          7z

      - name: Inventory raw files and archive contents
        run: |
          set -euo pipefail
          python3 tools/offline_conversion/asset_inventory.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: original-conquer-asset-audit
          path: reports/asset-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/asset-audit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit original Conquer asset formats and archive contents"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
